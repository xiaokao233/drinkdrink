<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9e5dc" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/figma-board.css" />
    <title>跟一口 · Figma 一次性导入板</title>
  </head>
  <body class="figma-board-page">
    <header class="figma-board-heading">
      <p>跟一口 · 视觉母版 V0.1</p>
      <h1>核心页面一次性导入板</h1>
      <span>390 × 844 · 视觉元素暂用占位 · 文字与功能结构优先</span>
    </header>
    <main id="figma-board" class="figma-board" aria-label="跟一口核心页面导入板">
      <article data-figma-screen="home-calm"></article>
      <article data-figma-screen="home-sent"></article>
      <article data-figma-screen="home-incoming"></article>
      <article data-figma-screen="home-followed"></article>
      <article data-figma-screen="relations"></article>
      <article data-figma-screen="profile"></article>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
